# Local-stage dependencies. `docker compose up -d` before `npm run dev:local`.
#
# Mongo runs as a single-node replica set, not a standalone. That is deliberate:
# Atlas is always a replica set, and multi-document transactions — which the
# refresh-token rotation path needs to consume a token and revoke its family
# atomically — are unavailable on a standalone. A standalone local mongod would
# let that code pass locally and fail in every deployed stage.
services:
  mongo:
    image: mongo:7
    container_name: lily-mongo
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initiates the replica set on first boot, then reports ok on every check.
      test: >
        mongosh --quiet --eval "
          try { rs.status().ok }
          catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]}).ok }
        "
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  # The browser meeting adapter, in the Linux environment it requires.
  # Not started by default — `docker compose up -d mongo` stays the quick path.
  # Bring this up with: docker compose up --build orchestrator
  orchestrator:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
    container_name: lily-orchestrator
    profiles: ['browser']
    ports:
      - '4100:4100' # simulated room / board
      - '4101:4101' # daemon link — your daemon on Windows connects here
    # Chrome maps large shared-memory segments per renderer. Docker's 64MB
    # default causes tab crashes that look like unrelated join failures.
    shm_size: '1gb'
    cap_add:
      # Lets Chrome's setuid sandbox work, so the browser keeps its sandbox
      # instead of being launched with --no-sandbox. It visits meeting URLs
      # we do not control, so the sandbox is worth keeping.
      - SYS_ADMIN
    environment:
      LILY_STAGE: local
      LILY_MEETING_PLATFORM: ${LILY_MEETING_PLATFORM:-local}
      LILY_MEETING_URL: ${LILY_MEETING_URL:-}
      LILY_BOT_DISPLAY_NAME: ${LILY_BOT_DISPLAY_NAME:-Lily (AI assistant)}
      LILY_LOCAL_OPENAI_API_KEY: ${LILY_LOCAL_OPENAI_API_KEY:-}
    # 0.0.0.0 so the published ports actually reach the process; the servers
    # bind loopback by default, which is correct outside a container.
    command: ['node', 'orchestrator/dist/main.js']

volumes:
  mongo-data:
